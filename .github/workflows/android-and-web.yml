name: SmartCart Web, PWA & Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-bundle:
    name: Unit Tests & Standalone HTML Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unit Tests (Core Engine & File Export/Import)
        run: npm test

      - name: Build Self-Contained Mobile HTML Bundle
        run: node scripts/bundle-standalone.js

      - name: Upload Standalone HTML App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCart-Standalone-Handy-App
          path: |
            dist/SmartCart_Handy_App.html
            index.html
            manifest.json
            sw.js
            src/
          retention-days: 30

  build-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    needs: test-and-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets in dist/
        run: node scripts/bundle-standalone.js

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCart-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Direct APK & HTML Release on GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmartCart.apk
          APP_VERSION=$(node -p "require('./package.json').version")
          if gh release view "v${APP_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            TAG="v${APP_VERSION}-r${{ github.run_number }}"
          else
            TAG="v${APP_VERSION}"
          fi
          gh release create "$TAG" SmartCart.apk dist/SmartCart_Handy_App.html \
            --repo "${{ github.repository }}" \
            --title "SmartCart Einkaufslisten-App ($TAG)" \
            --notes "### 📱 Direkter Handy-Download (ohne Entpacken)
          - **Android App (.apk):** [SmartCart.apk direkt herunterladen](https://github.com/${{ github.repository }}/releases/latest/download/SmartCart.apk)
          - **Offline HTML-Einzeldatei (Android & iOS):** [SmartCart_Handy_App.html herunterladen](https://github.com/${{ github.repository }}/releases/latest/download/SmartCart_Handy_App.html)

          ### ✨ Highlights in v${APP_VERSION}
          - **Natives Android Datei-Teilen & Speichern (Neu in v1.1.1):** Integrierte Capacitor-Plugins (@capacitor/share & @capacitor/filesystem) ermöglichen direktes Teilen von .smartcart.json-Einkaufslisten über das native Android-Share-Sheet (WhatsApp, E-Mail, Messenger) sowie direktes Speichern im Dokumenten-Ordner
          - **Spezifikation / Marke:** Optionale Spezifikation auf Einkaufslisten- und Supermarkt-Einträgen inkl. Mehrfach-Koexistenz pro Warengruppe und exaktem Matching mit Fallback auf unspezifizierte Einträge
          - **Unbekannte Waren & Long-Press:** Noch nicht im Supermarkt vorhandene Waren stehen am Anfang der offenen Liste, sortieren sich beim Abhaken sauber ein und lassen sich per Long-Press direkt in den Supermarkt aufnehmen
          - **Drag-and-Drop Auto-Scroll:** Automatisches Rand-Scrollen beim Umsortieren langer Supermarkt-Listen (Touch & Desktop)
          - **Reiner Datei-Export & -Import (.smartcart.json):** Speichern, Datei-Teilen (WhatsApp, Mail, Messenger) und validierter Datei-Import (Neu / Zusammenführen / Ersetzen)" \
            --latest
